<!DOCTYPE html> 

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine?</title>
  <style>
    body {
      background: pink;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #yes {
      background-color: red;
      color: white;
    }

    #no {
      background-color: gray;
      color: white;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Will you be my Valentine? 💖</h1>
    <button id="yes" onclick="yesClick()">Yes</button>
    <button id="no" onmouseover="moveButton()">No</button>
  </div>

  <script>
    function yesClick() {
      document.body.innerHTML = "<h1 style='color:red;'>YAYYY I LOVE YOU ❤️🥰</h1>";
    }

    function moveButton() {
      const button = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      button.style.left = x + "px";
      button.style.top = y + "px";
    }
  </script>

</body>
</html>
