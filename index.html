<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine?</title>
  <style>
    body {
      background-color: pink;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    img {
      width: 250px;
      margin-top: 40px;
    }

    h1 {
      margin-top: 20px;
    }

    button {
      font-size: 20px;
      padding: 10px 25px;
      margin: 15px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    #yesBtn {
      background-color: red;
      color: white;
    }

    #noBtn {
      background-color: white;
      color: red;
    }
  </style>
</head>
<body>

  <img src="https://boomf.com/cdn/shop/products/RabiahShahid-will-you-be-my-valentine-meme-cards_20-cat-meme.jpg?v=1671429959" alt="Valentine Image">

  <h1>Will you be my Beefanator 3000? ❤️</h1>

  <button id="yesBtn" onclick="yesClicked()">Yes</button>
  <button id="noBtn" onclick="moveNo()">No</button>

  <script>
    function yesClicked() {
      document.body.innerHTML = "<h1>YAY!! 💖 I love you!!</h1>";
    }

    function moveNo() {
      const btn = document.getElementById("noBtn");
      btn.style.position = "absolute";
      btn.style.left = Math.random() * 80 + "vw";
      btn.style.top = Math.random() * 80 + "vh";
    }
  </script>

</body>
</html>
